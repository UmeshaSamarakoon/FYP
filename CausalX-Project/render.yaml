services:
  - type: web
    name: causalx-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn src.cvi.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CFN_ENSEMBLE_MANIFEST_PATH
        value: models/fakeavceleb_best_step46_multiseed_manifest.json
      - key: CFN_VIDEO_LEVEL_USE_DEFAULT_TABULAR
        value: "false"
      - key: CFN_VIDEO_LEVEL_USE_DEFAULT_MANIFEST
        value: "false"
