services:
  - type: web
    name: causalx-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn src.cvi.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CFN_EMB_MODEL_PATH
        value: models/cfn_emb.pth
      - key: CFN_SCALER_PATH
        value: models/cfn_scaler.pkl
      - key: CFN_REQUIRE_FLAG
        value: "true"
      - key: CFN_ENABLE_BENCHMARK_OVERRIDE
        value: "false"
      - key: CFN_VIDEO_LEVEL_USE_DEFAULT_TABULAR
        value: "false"
      - key: CFN_VIDEO_LEVEL_USE_DEFAULT_MANIFEST
        value: "false"
